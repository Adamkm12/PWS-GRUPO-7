<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesion</title>
  <link rel="stylesheet" href="../assets/css/home.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
  <div id="header-template"></div>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="login-title">
      <p class="auth-eyebrow">Acceso privado</p>
      <h1 class="auth-title" id="login-title">Iniciar sesion</h1>
      <p class="auth-subtitle">Gestiona tus reservas, beneficios y preferencias en una sola cuenta.</p>

      <form class="auth-form" action="#" method="post">
        <div class="auth-form-group">
          <label for="login-email">Correo electronico</label>
          <input type="email" id="login-email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="auth-form-group">
          <label for="login-password">Contrasena</label>
          <input type="password" id="login-password" name="password" placeholder="********" required>
        </div>

        <button class="auth-submit" type="submit">Entrar</button>
      </form>

      <p class="auth-alt">Aun no tienes cuenta? <a href="register.html">Registrate aqui</a></p>
    </section>
  </main>

  <div id="footer-template"></div>

  <script src="../assets/js/modules/functions.js"></script>
  <script src="../assets/js/modules/templates.js"></script>
</body>
</html>
