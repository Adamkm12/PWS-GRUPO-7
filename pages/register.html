<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Luxury Gran Canaria</title>
  <link rel="stylesheet" href="../assets/css/register.css">
</head>
<body class="register-page">
  <a class="register-close" href="home.html" aria-label="Volver al inicio">
    <span class="close-lines" aria-hidden="true"></span>
  </a>

  <main class="register-layout">
    <aside class="register-visual" aria-label="Imagen inspiracional del hotel">
      <div class="register-visual-content">
        <p class="register-eyebrow">Member Access</p>
        <h2>Tu proxima escapada empieza aqui.</h2>
        <p>Diseno, privacidad y beneficios exclusivos para cada reserva.</p>
      </div>
    </aside>

    <section class="register-panel" aria-labelledby="register-title">
      <div class="register-shell">
        <p class="register-overline">Nueva cuenta</p>
        <h1 id="register-title">Crear perfil</h1>
        <p class="register-subtitle">Completa el formulario para gestionar reservas, preferencias y beneficios desde una sola cuenta.</p>

        <form class="register-form" action="#" method="post">
          <div class="register-grid">
            <div class="register-field">
              <label for="register-name">Nombre</label>
              <input type="text" id="register-name" name="name" placeholder="Nombre" required>
            </div>

            <div class="register-field">
              <label for="register-lastname">Apellidos</label>
              <input type="text" id="register-lastname" name="lastname" placeholder="Apellidos" required>
            </div>
          </div>

          <div class="register-grid">
            <div class="register-field">
              <label for="register-email">Correo electronico</label>
              <input type="email" id="register-email" name="email" placeholder="tu@email.com" required>
            </div>

            <div class="register-field">
              <label for="register-phone">Telefono</label>
              <input type="tel" id="register-phone" name="phone" placeholder="+34 600 000 000" required>
            </div>
          </div>

          <div class="register-grid">
            <div class="register-field">
              <label for="register-country">Pais</label>
              <input type="text" id="register-country" name="country" placeholder="Pais de residencia" required>
            </div>

            <div class="register-field">
              <label for="register-birthdate">Fecha de nacimiento</label>
              <input type="date" id="register-birthdate" name="birthdate" required>
            </div>
          </div>

          <div class="register-grid">
            <div class="register-field">
              <label for="register-password">Contrasena</label>
              <input type="password" id="register-password" name="password" placeholder="Minimo 8 caracteres" minlength="8" required>
            </div>

            <div class="register-field">
              <label for="register-confirm-password">Confirmar contrasena</label>
              <input type="password" id="register-confirm-password" name="confirm-password" placeholder="Repite la contrasena" minlength="8" required>
            </div>
          </div>

          <div class="register-checks">
            <label class="register-check">
              <input type="checkbox" name="terms" required>
              <span>Acepto los terminos y condiciones</span>
            </label>

            <label class="register-check">
              <input type="checkbox" name="newsletter">
              <span>Quiero recibir novedades y ofertas especiales</span>
            </label>
          </div>

          <button class="register-submit" type="submit">Crear cuenta</button>
        </form>

        <p class="register-login-link">Ya tienes cuenta? <a href="logIn.html">Iniciar sesion</a></p>
      </div>
    </section>
  </main>
</body>
</html>
