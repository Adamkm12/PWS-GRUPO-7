<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse</title>
  <link rel="stylesheet" href="../assets/css/home.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
  <div id="header-template"></div>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="register-title">
      <p class="auth-eyebrow">Nueva cuenta</p>
      <h1 class="auth-title" id="register-title">Registrarse</h1>
      <p class="auth-subtitle">Crea tu perfil para acceder a ventajas exclusivas y una experiencia personalizada.</p>

      <form class="auth-form" action="#" method="post">
        <div class="auth-form-group">
          <label for="register-name">Nombre completo</label>
          <input type="text" id="register-name" name="name" placeholder="Nombre y apellidos" required>
        </div>

        <div class="auth-form-group">
          <label for="register-email">Correo electronico</label>
          <input type="email" id="register-email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="auth-form-group">
          <label for="register-password">Contrasena</label>
          <input type="password" id="register-password" name="password" placeholder="Minimo 8 caracteres" minlength="8" required>
        </div>

        <button class="auth-submit" type="submit">Crear cuenta</button>
      </form>

      <p class="auth-alt">Ya tienes cuenta? <a href="logIn.html">Inicia sesion aqui</a></p>
    </section>
  </main>

  <div id="footer-template"></div>

  <script src="../assets/js/modules/functions.js"></script>
  <script src="../assets/js/modules/templates.js"></script>
</body>
</html>
