<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmation</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/templates/header.css">
  <link rel="stylesheet" href="../assets/css/templates/footer.css">
  <link rel="stylesheet" href="../assets/css/pages/accommodations.css">
  <link rel="stylesheet" href="../assets/css/pages/register.css">
  <style>
      .confirmation-box {
          text-align: center;
          padding: 80px 20px;
      }
      .confirmation-icon {
          font-size: 80px;
          color: var(--lux-gold);
          margin-bottom: 20px;
      }
  </style>
</head>
<body class="accommodations-page">

  <header>
    <div id="header-template"></div>
    <div class="header-steps">
        <div class="step completed">
            <div class="circle">1</div>
            <p>Room</p>
        </div>
        <div class="step completed">
            <div class="circle">2</div>
            <p>Details</p>
        </div>
        <div class="step completed">
            <div class="circle">3</div>
            <p>Payment</p>
        </div>
        <div class="step active">
            <div class="circle">4</div>
            <p>Confirmation</p>
        </div>
    </div>
  </header>

  <main>
    <section class="register-panel" style="margin: 0 auto; margin-top: 40px; margin-bottom: 40px; border-radius: 12px; max-width: 800px; width: 100%;">
      <div class="register-shell confirmation-box">
        <div class="confirmation-icon">✔</div>
        <h1>Booking Confirmed</h1>
        <p class="register-subtitle">Thank you for your reservation. We have sent the confirmation details to your email.</p>
        <br>
        <button class="register-submit" onclick="window.location.href='home.html'">Return to Home</button>
      </div>
    </section>
  </main>

  <footer id="footer-template"></footer>

  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
