<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaymentDetails</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/templates/header.css">
  <link rel="stylesheet" href="../assets/css/templates/footer.css">
  <link rel="stylesheet" href="../assets/css/pages/accommodations.css">
  <link rel="stylesheet" href="../assets/css/pages/register.css">
</head>
<body class="accommodations-page">

  <header>
    <div id="header-template"></div>
    <div class="header-steps">
        <div class="step completed">
            <div class="circle">1</div>
            <p>Room</p>
        </div>
        <div class="step completed">
            <div class="circle">2</div>
            <p>Details</p>
        </div>
        <div class="step active">
            <div class="circle">3</div>
            <p>Payment</p>
        </div>
        <div class="step">
            <div class="circle">4</div>
            <p>Confirmation</p>
        </div>
    </div>
  </header>

  <main>
    <section class="register-panel" style="margin: 0 auto; margin-top: 40px; margin-bottom: 40px; border-radius: 12px; max-width: 800px; width: 100%;">
      <div class="register-shell">
        <p class="register-overline">Step 3</p>
        <h1>Payment Details</h1>
        <p class="register-subtitle">Enter your payment information to finalize the reservation.</p>

        <form class="register-form" action="bookingConfirmation.html">
          <div class="register-grid">
            <div class="register-field" style="grid-column: span 2;">
              <label for="card-name">Name on Card</label>
              <input type="text" id="card-name" name="cardName" required>
            </div>
            <div class="register-field" style="grid-column: span 2;">
              <label for="card-number">Card Number</label>
              <input type="text" id="card-number" name="cardNumber" placeholder="0000 0000 0000 0000" required>
            </div>
            <div class="register-field">
              <label for="expiry">Expiry Date</label>
              <input type="text" id="expiry" name="expiry" placeholder="MM/YY" required>
            </div>
            <div class="register-field">
              <label for="cvv">CVV</label>
              <input type="text" id="cvv" name="cvv" placeholder="123" required>
            </div>
          </div>
          
          <button class="register-submit" type="submit">Confirm & Pay</button>
        </form>
      </div>
    </section>
  </main>

  <footer id="footer-template"></footer>

  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
