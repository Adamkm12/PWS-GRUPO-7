<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Details</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/templates/header.css">
  <link rel="stylesheet" href="../assets/css/templates/footer.css">
  <link rel="stylesheet" href="../assets/css/pages/accommodations.css">
  <link rel="stylesheet" href="../assets/css/pages/register.css">
</head>
<body class="accommodations-page">

  <header>
    <div id="header-template"></div>
    <!-- Adjusted directly for Step 2 -->
    <div class="header-steps">
        <div class="step completed">
            <div class="circle">1</div>
            <p>Room</p>
        </div>
        <div class="step active">
            <div class="circle">2</div>
            <p>Details</p>
        </div>
        <div class="step">
            <div class="circle">3</div>
            <p>Payment</p>
        </div>
        <div class="step">
            <div class="circle">4</div>
            <p>Confirmation</p>
        </div>
    </div>
  </header>

  <main>
    <section class="register-panel" style="margin: 0 auto; margin-top: 40px; margin-bottom: 40px; border-radius: 12px; max-width: 800px; width: 100%;">
      <div class="register-shell">
        <p class="register-overline">Step 2</p>
        <h1>Guest Details</h1>
        <p class="register-subtitle">Please enter the details for your reservation.</p>

        <form class="register-form" action="bookingPayment.html">
          <div class="register-grid">
            <div class="register-field">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="firstName" required>
            </div>
            <div class="register-field">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="lastName" required>
            </div>
            <div class="register-field">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="register-field">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" required>
            </div>
          </div>
          
          <button class="register-submit" type="submit">Continue to Payment</button>
        </form>
      </div>
    </section>
  </main>

  <footer id="footer-template"></footer>

  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
