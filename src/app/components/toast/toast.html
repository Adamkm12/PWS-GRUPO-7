<div class="toast-container" aria-live="polite" aria-atomic="true">
  @for (t of toastService.toasts(); track t.id) {
    <div class="toast-card" [class]="'toast-' + t.type" role="status">
      <i class="bi" [class]="iconFor(t.type)" aria-hidden="true"></i>
      <div class="toast-body">
        @if (t.title) {
          <strong class="toast-title">{{ t.title }}</strong>
        }
        <p class="toast-message">{{ t.message }}</p>
      </div>
      <button type="button" class="toast-close" aria-label="Cerrar notificacion" (click)="dismiss(t.id)">
        <i class="bi bi-x" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
