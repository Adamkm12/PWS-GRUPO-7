<div class="header-info">
  <div class="header-left"></div>

  <div class="header-logo-container">
    <a routerLink="/home">
      <span class="header-brand">Hotel Boutique</span>
    </a>
  </div>

  <div class="header-right">
    <button
      type="button"
      class="theme-icon-toggle"
      [class.is-animating]="animating"
      aria-label="Cambiar tema"
      [attr.aria-pressed]="themeService.isDark()"
      [title]="themeService.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
      (click)="onToggleTheme()"
    >
      <i [class]="themeService.isDark() ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill'" aria-hidden="true"></i>
    </button>

    <nav class="auth-links" aria-label="Acceso de usuarios">
      @if (currentUser) {
        <span class="user-greeting">Hola, {{ userName }}</span>
        <a class="auth-link-logout" href="#" (click)="logout(); $event.preventDefault()">Logout</a>
      } @else {
        <a class="auth-link-login" routerLink="/login">Login</a>
        <a class="auth-link-register" routerLink="/register">Register</a>
      }
    </nav>
  </div>
</div>

<header class="load-header" [class.menu-open]="isMenuOpen">
  <button
    class="menu-toggle"
    type="button"
    [attr.aria-expanded]="isMenuOpen"
    aria-controls="main-nav"
    aria-label="Abrir menu"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="menu-overlay" aria-hidden="true" (click)="closeMenu()"></div>

  <nav id="main-nav">
    <ul class="main-menu">
      <li><a routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Home</a></li>
      <li><a routerLink="/accommodations" routerLinkActive="active" (click)="closeMenu()">Accommodations</a></li>
      <li><a routerLink="/services" routerLinkActive="active" (click)="closeMenu()">Services</a></li>
      @if (currentUser) {
        <li><a routerLink="/my-bookings" routerLinkActive="active" (click)="closeMenu()">My Bookings</a></li>
      }
      <li><a routerLink="/gallery" routerLinkActive="active" (click)="closeMenu()">Gallery</a></li>
    </ul>

    <div class="menu-mobile-actions">
      <button
        type="button"
        class="menu-dark-toggle"
        [class.is-active]="themeService.isDark()"
        [attr.aria-pressed]="themeService.isDark()"
        (click)="toggleTheme()"
      >
        {{ themeService.isDark() ? 'Light mode' : 'Dark mode' }}
      </button>

      @if (currentUser) {
        <span class="user-greeting">Hola, {{ userName }}</span>
        <a class="auth-link-logout" href="#" (click)="logout(); $event.preventDefault()">Logout</a>
      } @else {
        <a class="auth-link-login" routerLink="/login" (click)="closeMenu()">Login</a>
        <a class="auth-link-register" routerLink="/register" (click)="closeMenu()">Register</a>
      }
    </div>
  </nav>
</header>
