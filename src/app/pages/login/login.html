<a class="register-close" routerLink="/home" aria-label="Volver al inicio">
  <span class="close-lines" aria-hidden="true"></span>
</a>

<main class="register-layout">
  <aside class="register-visual" aria-label="Imagen inspiracional del hotel">
    <div class="register-visual-content">
      <p class="register-eyebrow">Member Access</p>
      <h2>Bienvenido de nuevo.</h2>
      <p>Accede a tus reservas, preferencias y ventajas exclusivas.</p>
    </div>
  </aside>

  <section class="register-panel" aria-labelledby="login-title">
    <div class="register-shell">
      <p class="register-overline">Acceso privado</p>
      <h1 id="login-title">Iniciar sesion</h1>
      <p class="register-subtitle">Introduce tus datos para continuar con tu experiencia personalizada.</p>

      @if (errorMessage) {
        <div class="form-error-banner">{{ errorMessage }}</div>
      }

      <form class="register-form" (ngSubmit)="onSubmit()">
        <div class="register-grid">
          <div class="register-field">
            <label for="login-email">Correo electronico</label>
            <input
              type="email"
              id="login-email"
              name="email"
              placeholder="tu@email.com"
              [(ngModel)]="email"
              required
            >
          </div>

          <div class="register-field">
            <label for="login-password">Contrasena</label>
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="********"
              [(ngModel)]="password"
              required
            >
          </div>
        </div>

        <div class="register-checks">
          <label class="register-check">
            <input type="checkbox" name="remember-me" [(ngModel)]="rememberMe">
            <span>Mantener sesion iniciada</span>
          </label>
        </div>

        <button class="register-submit" type="submit" [disabled]="loading">
          {{ loading ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>

      <p class="register-login-link">Aun no tienes cuenta? <a routerLink="/register">Registrarse</a></p>
    </div>
  </section>
</main>
